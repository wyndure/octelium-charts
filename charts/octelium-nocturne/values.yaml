resourceServer:
  endpoint: octelium-rscserver-backend.octelium.svc.cluster.local
  port: 8080
  headless: true # Applies to IP endpoints; DNS endpoints use ExternalName.

replicas: 1 # No leader election; must remain 1.

imagePullSecrets: []
image:
  repository: ghcr.io/octelium/octelium-nocturne
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

regionRef: # region ConfigMap reference
  name: octelium-region

nodeSelector: {}

podLabels: {}
podAnnotations: {}

affinity: {}
tolerations: []

podSecurityContext: {}
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

extraInitContainers: []
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

resources:
  requests:
    cpu: 10m
    memory: 5Mi
  limits:
    cpu: 400m
    memory: 384Mi

spiffe:
  enabled: false
  csiDriver: csi.spiffe.io
  trustDomain: ""
  socketPath: ""

rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: [pods, services, secrets]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [nodes]
      verbs: [get, list, watch, update]
  workloadRules:
    - apiGroups: [apps]
      resources: [deployments]
      verbs: [get, list, create, update, delete]
    - apiGroups: [""]
      resources: [services, secrets]
      verbs: [create, update, delete]
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [get, create, update, delete]

networkPolicy:
  enabled: true

certificates:
  enabled: false
  issuerRef:
    name: ""
    kind: ClusterIssuer
    group: cert-manager.io
  cluster:
    enabled: true
    domain: "" # Used to derive default cluster certificate DNS names.
    dnsNames: [] # Empty uses domain and upstream wildcard names.
  namespaces: [] # Certificates for existing Octelium Namespaces only.
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
