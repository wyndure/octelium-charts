{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octelium-nocturne
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octelium.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "octelium.selectorLabels" "nocturne" | nindent 6 }}
  policyTypes: [Ingress]
  ingress: []
{{- end }}

