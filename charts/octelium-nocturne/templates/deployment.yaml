{{- if ne (int .Values.replicas) 1 -}}
{{- fail "Nocturne has no leader election; replicas must be 1." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octelium-nocturne
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octelium.labels" . | nindent 4 }}
    {{- include "octelium.selectorLabels" "nocturne" | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "octelium.selectorLabels" "nocturne" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "octelium.customLabels" (dict "root" . "component" "nocturne" "extra" .Values.podLabels) | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: octelium-nocturne
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.spiffe.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.spiffe.enabled }}
        {{- include "octelium.spiffeVolume" . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: nocturne
          image: {{ include "octelium.image" (dict "root" . "image" .Values.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- include "octelium.mergeEnv" (dict "base" (include "octelium.nocturne.env" . | fromYamlArray) "extra" .Values.extraEnv) | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.spiffe.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.spiffe.enabled }}
            {{- include "octelium.spiffeMount" . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          startupProbe:
            grpc: {port: 49090}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            grpc: {port: 49090}
            timeoutSeconds: 4
          livenessProbe:
            grpc: {port: 49090}
            periodSeconds: 30
            timeoutSeconds: 4

