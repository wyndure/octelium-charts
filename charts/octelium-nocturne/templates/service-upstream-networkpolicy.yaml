{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: svc-upstream
  namespace: octelium
  labels:
    {{- include "octelium.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "octelium.selectorLabels" "svc-k8s-upstream" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "octelium.selectorLabels" "svc" | nindent 14 }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: octelium
{{- end }}
