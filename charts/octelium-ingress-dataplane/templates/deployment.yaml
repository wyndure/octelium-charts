apiVersion: apps/v1
kind: Deployment
metadata:
  name: octelium-ingress-dataplane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octelium.labels" . | nindent 4 }}
    {{- include "octelium.selectorLabels" "ingress-dataplane" | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "octelium.selectorLabels" "ingress-dataplane" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "octelium.customLabels" (dict "root" . "component" "ingress-dataplane" "extra" .Values.podLabels) | nindent 8 }}
      annotations:
        checksum/envoy-config: {{ include (print $.Template.BasePath "/envoy-config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: envoy-config
          configMap:
            name: ingress-dataplane-envoy-config
        {{- if .Values.spiffe.enabled }}
        {{- include "octelium.spiffeVolume" . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: envoy
          image: {{ include "octelium.image" (dict "root" . "image" .Values.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [envoy]
          args: [-c, /etc/envoy/envoy.yaml]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraEnv }}
          env:
            {{- include "octelium.mergeEnv" (dict "base" (list) "extra" .) | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy/envoy.yaml
              subPath: config
              readOnly: true
            {{- if .Values.spiffe.enabled }}
            {{- include "octelium.spiffeMount" . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: {path: /ready, port: 11012}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /ready, port: 11012}
            timeoutSeconds: 4
          livenessProbe:
            httpGet: {path: /ready, port: 11012}
            periodSeconds: 30
            timeoutSeconds: 4

