{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octelium-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octelium.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "octelium.selectorLabels" "ingress" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
      from:
        - podSelector:
            matchLabels:
              app: octelium
              octelium.com/component-type: cluster
              octelium.com/component: ingress-dataplane
          namespaceSelector:
            {{- toYaml .Values.networkPolicy.clientNamespaceSelector | nindent 12 }}
{{- end }}

