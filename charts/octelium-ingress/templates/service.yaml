apiVersion: v1
kind: Service
metadata:
  name: octelium-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octelium.labels" . | nindent 4 }}
    {{- include "octelium.selectorLabels" "ingress" | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "octelium.selectorLabels" "ingress" | nindent 4 }}
  ports:
    - name: grpc
      protocol: TCP
      port: 8080
      targetPort: 8080

