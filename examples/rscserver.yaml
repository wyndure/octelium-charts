# For the octelium-rscserver chart only. Both credentials Secrets must exist in
# the namespace where this resource server is installed.
postgresql:
  host: postgres.database.svc.cluster.local
  port: 5432
  database: existing_octelium_database
  tls: true
  secretRef:
    name: octelium-database-credentials
    usernameKey: username
    passwordKey: password
redis:
  host: redis.database.svc.cluster.local
  port: 6379
  database: 0
  tls: true
  secretRef:
    name: octelium-redis-credentials
    usernameKey: username
    passwordKey: password

initializer:
  domain: access.example.com
